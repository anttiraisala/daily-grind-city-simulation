<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>City PoC viewer</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117; --panel: rgba(22, 27, 34, 0.9); --line: #30363d;
    --fg: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --warn: #d29922;
    --car: #ffa657; --bike: #56d364; --walk: #d2a8ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; left: 8px; right: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 8px; pointer-events: none; }
  .panel {
    pointer-events: auto; touch-action: manipulation;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
    backdrop-filter: blur(6px);
  }
  .clock { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .warn { color: var(--warn); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button {
    font: inherit; color: var(--fg); background: #21262d; border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; min-height: 36px; cursor: pointer;
  }
  button.on { background: #1f6feb; border-color: #388bfd; }
  .stats { display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-variant-numeric: tabular-nums; }
  .stats span:nth-child(odd) { color: var(--muted); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  #agent { position: fixed; left: 8px; bottom: 8px; width: min(420px, calc(100vw - 16px)); display: none; }
  #agent h3 { margin: 0 0 6px; font-size: 14px; }
  #agent .stats { grid-template-columns: auto 1fr; margin-bottom: 8px; }
  #scale { position: fixed; right: 12px; bottom: 12px; color: var(--muted); font-size: 12px; text-align: right; pointer-events: none; }
  #scale i { display: block; height: 4px; border: 2px solid var(--muted); border-top: 0; margin-top: 2px; }
  #error { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; background: var(--bg); }
  .head { display: flex; gap: 10px; align-items: baseline; }
  #statsbtn { display: none; }
  @media (max-width: 640px) {
    .hud { gap: 6px; }
    .panel { padding: 6px 8px; }
    .clock { font-size: 18px; }
    button { min-height: 34px; padding: 4px 8px; }
    #statsbtn { display: inline-block; }
    #statspanel { display: none; }
    #statspanel.open { display: block; }
    #speedinfo { display: none; }
  }
</style>
</head>
<body>
<canvas id="map"></canvas>

<div class="hud">
  <div class="panel">
    <div class="head">
      <div class="clock" id="clock">--:--</div>
      <div class="muted" id="day">connecting...</div>
    </div>
    <div class="row" style="margin-top:6px">
      <button id="pause">Pause</button>
      <button data-speed="1">x1</button>
      <button data-speed="60">x60</button>
      <button data-speed="600">x600</button>
      <button data-speed="3600">x3600</button>
      <button id="statsbtn">Stats</button>
    </div>
    <div class="muted" id="speedinfo" style="margin-top:4px"></div>
  </div>
  <div class="panel" id="statspanel">
    <div class="stats">
      <span>On the road</span><span id="s-moving">-</span>
      <span>Cars</span><span id="s-cars">-</span>
      <span>Car speed</span><span id="s-speed">-</span>
      <span>Late today</span><span id="s-late">-</span>
      <span>Trips done</span><span id="s-trips">-</span>
      <span>Commands</span><span id="s-cmds">-</span>
    </div>
    <div style="margin-top:6px">
      <span class="dot" style="background:var(--car)"></span>car
      <span class="dot" style="background:var(--bike);margin-left:8px"></span>bike
      <span class="dot" style="background:var(--walk);margin-left:8px"></span>walking
    </div>
    <div class="row" style="margin-top:6px">
      <button id="heat" class="on">Slow-traffic heat</button>
      <button id="fit">Fit city</button>
    </div>
  </div>
</div>

<div id="agent" class="panel">
  <h3 id="a-title">Resident</h3>
  <div class="stats" id="a-stats"></div>
  <div class="row">
    <button id="a-follow">Follow</button>
    <button id="a-delay">Delay departure 30 min</button>
    <button id="a-close">Close</button>
  </div>
</div>

<div id="scale"><span id="scale-label"></span><i id="scale-bar"></i></div>
<div id="error"><div><h2>Cannot reach the simulation</h2><p class="muted">Check that the server is running and that the address includes the access token (?t=...).</p></div></div>

<script>
(() => {
  "use strict";
  const token = new URLSearchParams(location.search).get("t") || "";
  const $ = (id) => document.getElementById(id);
  const canvas = $("map");
  const ctx = canvas.getContext("2d");

  let dpr = 1, cw = 0, ch = 0;
  let info = null;
  const view = { x: 0, y: 0, scale: 0.1 }; // x, y: world meters at the screen centre; scale: pixels per meter
  const data = { time: 0, n: 0, moving: 0, ids: new Uint32Array(0), xs: new Float32Array(0), ys: new Float32Array(0), modes: new Uint8Array(0) };
  let heat = null;
  let showHeat = true;
  let selected = -1;
  let follow = false;
  let status = null;

  const COLORS = ["#ffa657", "#56d364", "#d2a8ff"];
  const RADIUS_M = [2.2, 0.9, 0.4]; // car, bike, pedestrian: real sizes, so people take up space

  // ------------------------------------------------------------------ API

  const apiUrl = (path, params) => {
    const p = new URLSearchParams(params || {});
    p.set("t", token);
    return "/api/" + path + "?" + p;
  };
  const getJSON = async (path, params) => {
    const r = await fetch(apiUrl(path, params), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  };
  const getBytes = async (path, params) => {
    const r = await fetch(apiUrl(path, params), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.arrayBuffer();
  };
  const post = (params) => fetch(apiUrl("cmd", params), { method: "POST" }).catch(() => {});

  // ------------------------------------------------------------------ view

  const resize = () => {
    dpr = window.devicePixelRatio || 1;
    cw = window.innerWidth;
    ch = window.innerHeight;
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    draw();
  };
  const fitScale = () => info ? Math.min(cw / (info.nodes_w * info.block_m), ch / (info.nodes_h * info.block_m)) * 0.95 : 0.1;
  const fitView = () => {
    if (!info) return;
    view.x = ((info.nodes_w - 1) * info.block_m) / 2;
    view.y = ((info.nodes_h - 1) * info.block_m) / 2;
    view.scale = fitScale();
    draw();
  };
  const zoomAt = (px, py, factor) => {
    const wx = view.x + (px - cw / 2) / view.scale;
    const wy = view.y + (py - ch / 2) / view.scale;
    view.scale = Math.min(80, Math.max(fitScale() * 0.3, view.scale * factor));
    view.x = wx - (px - cw / 2) / view.scale;
    view.y = wy - (py - ch / 2) / view.scale;
  };

  // ------------------------------------------------------------------ drawing

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#0d1117";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (!info) return;
    const s = view.scale;
    const B = info.block_m, W = info.nodes_w, H = info.nodes_h;
    ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * (cw / 2 - view.x * s), dpr * (ch / 2 - view.y * s));
    const x0 = view.x - cw / 2 / s, x1 = view.x + cw / 2 / s;
    const y0 = view.y - ch / 2 / s, y1 = view.y + ch / 2 / s;

    ctx.fillStyle = "#10161d";
    ctx.fillRect(-B / 2, -B / 2, W * B, H * B);

    if (s * B > 4) {
      ctx.strokeStyle = "#2d333b";
      ctx.lineWidth = Math.max(7, 1 / s); // streets are 7 m wide, at least one pixel
      ctx.beginPath();
      const i0 = Math.max(0, Math.floor(x0 / B)), i1 = Math.min(W - 1, Math.ceil(x1 / B));
      const j0 = Math.max(0, Math.floor(y0 / B)), j1 = Math.min(H - 1, Math.ceil(y1 / B));
      for (let i = i0; i <= i1; i++) { ctx.moveTo(i * B, 0); ctx.lineTo(i * B, (H - 1) * B); }
      for (let j = j0; j <= j1; j++) { ctx.moveTo(0, j * B); ctx.lineTo((W - 1) * B, j * B); }
      ctx.stroke();
    }

    if (showHeat && heat) {
      ctx.imageSmoothingEnabled = false;
      ctx.globalAlpha = 0.6;
      ctx.drawImage(heat, -B / 2, -B / 2, W * B, H * B);
      ctx.globalAlpha = 1;
    }

    for (let m = 0; m < 3; m++) {
      ctx.fillStyle = COLORS[m];
      const r = Math.max(RADIUS_M[m], 1.3 / s);
      const square = r * s < 2.5;
      ctx.beginPath();
      for (let k = 0; k < data.n; k++) {
        if (data.modes[k] !== m) continue;
        const x = data.xs[k], y = data.ys[k];
        if (x < x0 - r || x > x1 + r || y < y0 - r || y > y1 + r) continue;
        if (square) ctx.rect(x - r, y - r, 2 * r, 2 * r);
        else { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, 6.2832); }
      }
      ctx.fill();
    }

    if (selected >= 0) {
      const k = indexOf(selected);
      if (k >= 0) {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2 / s;
        ctx.beginPath();
        ctx.arc(data.xs[k], data.ys[k], Math.max(10 / s, RADIUS_M[data.modes[k]] * 1.8), 0, 6.2832);
        ctx.stroke();
      }
    }
    drawScaleBar();
  }

  function drawScaleBar() {
    const target = 90 / view.scale; // meters that fit in about 90 px
    const pow = Math.pow(10, Math.floor(Math.log10(target)));
    const nice = [1, 2, 5, 10].map((f) => f * pow).find((v) => v >= target * 0.7) || pow * 10;
    const px = nice * view.scale;
    $("scale-bar").style.width = px + "px";
    $("scale-bar").style.marginLeft = "auto";
    $("scale-label").textContent = nice >= 1000 ? nice / 1000 + " km" : nice + " m";
  }

  function indexOf(id) {
    for (let k = 0; k < data.n; k++) if (data.ids[k] === id) return k;
    return -1;
  }

  // ------------------------------------------------------------------ data polling

  function parseSnapshot(buf) {
    const dv = new DataView(buf);
    data.time = dv.getUint32(4, true) * 4294967296 + dv.getUint32(0, true);
    data.moving = dv.getUint32(8, true);
    const n = dv.getUint32(12, true);
    if (n > data.ids.length) {
      const cap = Math.ceil(n * 1.25) + 16;
      data.ids = new Uint32Array(cap);
      data.xs = new Float32Array(cap);
      data.ys = new Float32Array(cap);
      data.modes = new Uint8Array(cap);
    }
    let o = 32;
    for (let k = 0; k < n; k++, o += 13) {
      data.ids[k] = dv.getUint32(o, true);
      data.xs[k] = dv.getFloat32(o + 4, true);
      data.ys[k] = dv.getFloat32(o + 8, true);
      data.modes[k] = dv.getUint8(o + 12);
    }
    data.n = n;
  }

  let inflight = false;
  async function pollSnapshot() {
    if (inflight || !info) return;
    inflight = true;
    try {
      const pad = 40 / view.scale;
      const buf = await getBytes("snapshot", {
        x0: view.x - cw / 2 / view.scale - pad, y0: view.y - ch / 2 / view.scale - pad,
        x1: view.x + cw / 2 / view.scale + pad, y1: view.y + ch / 2 / view.scale + pad,
        cap: 60000,
      });
      parseSnapshot(buf);
      if (follow && selected >= 0) {
        const k = indexOf(selected);
        if (k >= 0) { view.x += (data.xs[k] - view.x) * 0.5; view.y += (data.ys[k] - view.y) * 0.5; }
      }
      $("error").style.display = "none";
    } catch (e) {
      $("error").style.display = "grid";
    }
    inflight = false;
    draw();
  }

  async function pollStatus() {
    try {
      status = await getJSON("status");
    } catch (e) { return; }
    $("clock").textContent = status.clock;
    $("day").textContent = "Day " + status.day + (status.paused ? " (paused)" : "");
    $("s-moving").textContent = status.moving.toLocaleString();
    $("s-cars").textContent = status.cars.toLocaleString();
    $("s-speed").textContent = status.avg_speed_pct.toFixed(0) + "% of free flow";
    $("s-late").textContent = status.late_today.toLocaleString();
    $("s-trips").textContent = status.trips_done.toLocaleString();
    $("s-cmds").textContent = status.commands;
    const slow = !status.paused && status.speed > 0 && status.actual_speed < status.speed * 0.9;
    $("speedinfo").textContent = status.paused
      ? "paused"
      : "speed x" + status.speed + " (running x" + Math.round(status.actual_speed) + ")" + (slow ? " - cannot keep up" : "");
    $("speedinfo").className = slow ? "warn" : "muted";
    $("pause").textContent = status.paused ? "Resume" : "Pause";
    $("pause").classList.toggle("on", status.paused);
    document.querySelectorAll("button[data-speed]").forEach((b) => b.classList.toggle("on", Number(b.dataset.speed) === status.speed));
  }

  async function pollHeat() {
    if (!showHeat || !info) return;
    try {
      const bytes = new Uint8Array(await getBytes("heat"));
      const W = info.nodes_w, H = info.nodes_h;
      if (!heat) { heat = document.createElement("canvas"); heat.width = W; heat.height = H; }
      const c = heat.getContext("2d");
      const img = c.createImageData(W, H);
      for (let i = 0; i < W * H; i++) {
        const v = bytes[i];
        if (v < 24) continue;
        const t = (v - 24) / 231;
        img.data[i * 4] = 255;
        img.data[i * 4 + 1] = Math.round(210 * (1 - t));
        img.data[i * 4 + 2] = Math.round(40 * (1 - t));
        img.data[i * 4 + 3] = Math.round(70 + 185 * t);
      }
      c.putImageData(img, 0, 0);
      draw();
    } catch (e) { /* try again next time */ }
  }

  async function pollAgent() {
    if (selected < 0) return;
    try {
      const a = await getJSON("agent", { id: selected });
      $("a-title").textContent = "Resident #" + a.id + " (" + a.kind + ", " + a.mode + ")";
      const rows = [
        ["State", a.state], ["Home", a.home.join(", ")], ["Destination", a.destination.join(", ")],
        ["Punctuality", a.punctuality], ["Expects commute", a.commute_estimate_min + " min"],
        ["Planned arrival", a.planned_arrival], ["Planned leave", a.planned_leave], ["Next departure", a.next_departure],
      ];
      $("a-stats").innerHTML = rows.map(([k, v]) => "<span>" + k + "</span><span>" + v + "</span>").join("");
    } catch (e) { /* ignore */ }
  }

  // ------------------------------------------------------------------ interaction

  const pointers = new Map();
  let down = null, pinchPrev = null;

  const pinchState = () => {
    const [a, b] = [...pointers.values()];
    return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  };

  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) down = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false };
    else { down = null; pinchPrev = pinchState(); }
  });
  canvas.addEventListener("pointermove", (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    if (pointers.size === 1) {
      view.x -= (e.clientX - p.x) / view.scale;
      view.y -= (e.clientY - p.y) / view.scale;
      if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) {
        down.moved = true;
        if (follow) setFollow(false);
      }
      p.x = e.clientX; p.y = e.clientY;
    } else if (pointers.size === 2) {
      p.x = e.clientX; p.y = e.clientY;
      const now = pinchState();
      view.x -= (now.mx - pinchPrev.mx) / view.scale;
      view.y -= (now.my - pinchPrev.my) / view.scale;
      zoomAt(now.mx, now.my, now.d / pinchPrev.d);
      pinchPrev = now;
    }
    draw();
  });
  const release = (e) => {
    pointers.delete(e.pointerId);
    if (down && !down.moved && performance.now() - down.t < 400) tap(e.clientX, e.clientY);
    down = null;
    pinchPrev = pointers.size === 2 ? pinchState() : null;
  };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015));
    draw();
  }, { passive: false });

  function tap(px, py) {
    const wx = view.x + (px - cw / 2) / view.scale;
    const wy = view.y + (py - ch / 2) / view.scale;
    const reach = 22 / view.scale;
    let best = -1, bestD = reach * reach;
    for (let k = 0; k < data.n; k++) {
      const dx = data.xs[k] - wx, dy = data.ys[k] - wy;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = k; }
    }
    if (best >= 0) select(data.ids[best]);
    else { selected = -1; $("agent").style.display = "none"; setFollow(false); draw(); }
  }

  function select(id) {
    selected = id;
    $("agent").style.display = "block";
    pollAgent();
    draw();
  }
  function setFollow(on) {
    follow = on;
    $("a-follow").classList.toggle("on", on);
  }

  $("a-follow").addEventListener("click", () => {
    setFollow(!follow);
    if (follow) {
      const k = indexOf(selected);
      view.scale = Math.max(view.scale, 6); // zoom in until a single person fills the view
      if (k >= 0) { view.x = data.xs[k]; view.y = data.ys[k]; }
      draw();
    }
  });
  $("a-delay").addEventListener("click", () => { if (selected >= 0) post({ kind: "delay", agent: selected, seconds: 1800 }).then(() => { pollStatus(); pollAgent(); }); });
  $("a-close").addEventListener("click", () => { selected = -1; setFollow(false); $("agent").style.display = "none"; draw(); });
  $("pause").addEventListener("click", () => post({ kind: status && status.paused ? "resume" : "pause" }).then(pollStatus));
  document.querySelectorAll("button[data-speed]").forEach((b) => b.addEventListener("click", () => post({ kind: "speed", value: b.dataset.speed }).then(pollStatus)));
  $("heat").addEventListener("click", () => { showHeat = !showHeat; $("heat").classList.toggle("on", showHeat); if (showHeat) pollHeat(); draw(); });
  $("fit").addEventListener("click", fitView);
  $("statsbtn").addEventListener("click", () => {
    const open = $("statspanel").classList.toggle("open");
    $("statsbtn").classList.toggle("on", open);
  });
  window.addEventListener("resize", resize);

  // ------------------------------------------------------------------ start

  async function start() {
    resize();
    try {
      info = await getJSON("info");
    } catch (e) {
      $("error").style.display = "grid";
      return;
    }
    fitView();
    pollStatus();
    pollHeat();
    setInterval(pollSnapshot, 120);
    setInterval(pollStatus, 500);
    setInterval(pollHeat, 4000);
    setInterval(pollAgent, 700);
  }
  start();
})();
</script>
</body>
</html>
