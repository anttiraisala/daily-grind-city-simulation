[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/server"]
# poc/ is a throwaway proof of concept with its own Cargo.toml.
exclude = ["poc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/anttiraisala/daily-grind-city-simulation"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
